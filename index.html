<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Alex Monroe links</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #F9F8F3; color: #141414; font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  main { max-width: 420px; padding: 32px 20px; text-align: center; }
  h1 { font: 400 26px/1.2 "Hoefler Text", Baskerville, Georgia, serif; margin: 0 0 10px; }
  p { color: #606A72; margin: 0 0 8px; }
  a { color: #141414; }
</style>
</head>
<body>
<main>
  <h1>Opening the app…</h1>
  <p>If nothing happens, check the app is installed on this Mac, then <a id="open" href="#">try again</a>.</p>
  <p>These links only open on a Mac with the app and the team folder.</p>
</main>
<script>
  // Links look like https://am-click.github.io/#<app>/<what>?… : the part after # names the app to open and what to show.
  // It stays in this browser: it is never sent to GitHub, so campaign and Ad names stay private.
  // To add an app, add its name and link scheme here (the Dev apps have their own).
  var APPS = { 'ad-studio': 'adstudio', 'ad-studio-dev': 'adstudio-dev' };
  (function () {
    var m = location.hash.slice(1).match(/^([a-z-]+)\/(.+)$/);
    if (!m || !APPS[m[1]]) return;
    var url = APPS[m[1]] + '://' + m[2];
    document.getElementById('open').href = url;
    location.replace(url);
    // Then close this tab. Browsers allow that for a tab opened from a link with nothing before it;
    // if this one won't close, say so instead.
    setTimeout(function () {
      window.close();
      setTimeout(function () {
        document.querySelector('h1').textContent = 'Opened in the app';
        document.querySelector('p').textContent = 'You can close this tab.';
      }, 300);
    }, 1500);
  }());
</script>
</body>
</html>
